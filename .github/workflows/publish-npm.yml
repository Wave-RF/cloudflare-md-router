name: Publish (npm)

# Release-on-merge: every push to main runs semantic-release, which reads the
# Conventional-Commit subjects since the last vX.Y.Z tag and either publishes a
# new version or does nothing (see .releaserc.json for the rules, RELEASING.md
# for the human version).
#
# The filename is load-bearing: npm allows ONE trusted publisher per package and
# it is pinned to `publish-npm.yml` on npmjs.com. Don't rename this file.
#
# Auth is pure OIDC trusted publishing (provenance included) — there is no
# NPM_TOKEN. The GitHub side (tag, Release, issue/PR comments) uses the built-in
# GITHUB_TOKEN. Nothing is committed back to main: the git tag is the version.

on:
  push:
    branches: [main]

# Releases are strictly serial and an in-flight publish is never cancelled.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the vX.Y.Z tag + create the GitHub Release
      issues: write # success comments / "release failed" issue
      pull-requests: write # success comments on released PRs
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # it authenticates with GITHUB_TOKEN itself

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.1.3"
          run_install: false

      # Node 24 ships npm >= 11.5.1 (required for OIDC). Deliberately NO
      # `registry-url`: it writes an .npmrc that points auth at a token
      # placeholder and breaks semantic-release's OIDC exchange.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # No committed lockfile (library — see .gitignore); semantic-release and
      # its preset are pinned to exact versions in package.json instead.
      - run: pnpm install --no-frozen-lockfile

      # A red main never releases.
      - run: pnpm run verify

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
