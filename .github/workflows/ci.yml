name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` isn't in the default set — without it, draft → ready
    # transitions don't re-trigger CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual re-run escape hatch — `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# PR pushes: cancel in-flight, only the latest commit matters. Main pushes:
# run each commit (the required check must exist per merged SHA).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.1.3"
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 — matches .nvmrc and the publish job. pnpm 11 requires Node
          # >= 22.13, so the toolchain can't run on the package's declared >=18
          # floor; engines.node documents the consumer floor instead.
          node-version: "24"

      # Install exactly the committed pnpm-lock.yaml, so CI tests the dependency
      # tree that gets reviewed and released. (The lockfile doesn't reach
      # consumers; they resolve with their own.)
      - run: pnpm install --frozen-lockfile

      - name: Lint + format check (Biome)
        run: pnpm run check

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Test (node --test)
        run: pnpm run test

      # The preset and the notes generator are coupled; an incompatible bump only
      # fails at generateNotes, mid-release on main. Catch it on the PR instead.
      - name: Release config (analyzer + notes, offline)
        run: pnpm run check:release
